# Foundry Hosted-agent manifest for BrokerWorkbench.
# Consumed by `azd ai agent init/deploy` and the Foundry control plane.
#
# After SC infra is provisioned, fill in:
#   - container.image  -> <acr>.azurecr.io/broker-hosted-agent:sc-vN
#   - environment_variables values that reference SC FQDNs
#
# The Foundry runtime injects FOUNDRY_PROJECT_ENDPOINT,
# AZURE_AI_MODEL_DEPLOYMENT_NAME, AZURE_CLIENT_ID, and
# APPLICATIONINSIGHTS_CONNECTION_STRING automatically.

apiVersion: hostedagents.foundry.azure.com/v1
kind: HostedAgent
metadata:
  name: brokerworkbench
spec:
  protocols:
    - responses
  container:
    image: PLACEHOLDER_ACR.azurecr.io/broker-hosted-agent:sc-v1
    cpu: "1"
    memory: 2Gi
  environment_variables:
    # The chat client (OpenAIChatCompletionClient in Azure mode) needs the
    # Foundry account endpoint, not the project endpoint.
    - name: AZURE_AI_FOUNDRY_ENDPOINT
      value: PLACEHOLDER_FOUNDRY_ENDPOINT
    - name: AZURE_AI_MODEL_DEPLOYMENT
      value: gpt-5
    - name: AZURE_AI_API_VERSION
      value: 2025-03-01-preview
    # Cap gpt-5 reasoning effort for interactive latency (minimal|low|medium|
    # high, or "default" to use the model default). "low" balances latency
    # against sound MCP tool-call decisions. Name must avoid the reserved
    # AGENT_/FOUNDRY_ prefixes (Foundry rejects those on hosted agents).
    - name: REASONING_EFFORT
      value: low
    # Cap interactive output tokens (broker chat targets <300 words). Trims
    # the slow tail of every model call. Set to 0/"default" to disable.
    - name: CHAT_MAX_OUTPUT_TOKENS
      value: "700"
    # MCP server inside the same Container Apps env / VNet.
    - name: MCP_SERVER_URL
      value: http://PLACEHOLDER_MCP_FQDN/mcp
