name: tests

on:
  push:
    branches: [main, fieldday]
  pull_request:
    branches: [main, fieldday]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: pytest (MCP + seed)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            mcp_server/requirements.txt
            tests/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r mcp_server/requirements.txt
          pip install -r tests/requirements.txt

      - name: Seed database
        env:
          DATABASE_URL: sqlite+aiosqlite:///./data/db/transactional_data.db
          MASTER_DATABASE_URL: sqlite+aiosqlite:///./data/db/master_data.db
        run: |
          mkdir -p data/db
          python -m data.seed.setup --reseed

      - name: Run pytest
        env:
          DATABASE_URL: sqlite+aiosqlite:///./data/db/transactional_data.db
          MASTER_DATABASE_URL: sqlite+aiosqlite:///./data/db/master_data.db
        run: pytest tests/ -v --tb=short

      - name: Upload pytest logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-logs
          path: |
            .pytest_cache/
            data/db/
          if-no-files-found: ignore

  e2e-smoke:
    name: playwright (frontend smoke)
    runs-on: ubuntu-latest
    needs: backend-tests
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            mcp_server/requirements.txt

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend-react/package.json
            tests/e2e/package.json

      - name: Install Python deps + seed DB
        env:
          DATABASE_URL: sqlite+aiosqlite:///./data/db/transactional_data.db
          MASTER_DATABASE_URL: sqlite+aiosqlite:///./data/db/master_data.db
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r mcp_server/requirements.txt
          mkdir -p data/db
          python -m data.seed.setup --reseed

      - name: Start MCP server (background)
        env:
          DATABASE_URL: sqlite+aiosqlite:///./data/db/transactional_data.db
          MASTER_DATABASE_URL: sqlite+aiosqlite:///./data/db/master_data.db
          MCP_HOST: 127.0.0.1
          PORT: "8001"
        run: |
          nohup python -m mcp_server.server > mcp_server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null -w "%{http_code}" http://127.0.0.1:8001/mcp | grep -qE '^[2-4]'; then
              echo "MCP server is up."
              exit 0
            fi
            sleep 1
          done
          echo "MCP server did not become ready in 30s." >&2
          cat mcp_server.log
          exit 1

      - name: Build React frontend
        working-directory: frontend-react
        run: |
          npm install
          npm run build

      - name: Serve frontend on :8080 (background)
        working-directory: frontend-react
        run: |
          nohup npx --yes serve -l 8080 dist > ../serve.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080 -o /dev/null; then
              echo "Frontend is up."
              exit 0
            fi
            sleep 1
          done
          echo "Frontend did not become ready in 30s." >&2
          cat ../serve.log
          exit 1

      - name: Install Playwright deps
        working-directory: tests/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        id: playwright
        continue-on-error: true
        working-directory: tests/e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: always() && steps.playwright.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          if-no-files-found: ignore
